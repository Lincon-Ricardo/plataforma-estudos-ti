name: Deploy Level Up IT to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: levelup-it
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: levelup-it/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and tests
        run: npx tsc --noEmit && npm test
      - name: Static export (basePath do Pages)
        run: npm run build
        env:
          NEXT_BASE_PATH: /plataforma-estudos-ti
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: levelup-it/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
